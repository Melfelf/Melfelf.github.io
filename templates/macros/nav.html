{% macro site_nav(current_path="") %}
<a class="skip-link" href="#main-content">Zum Inhalt</a>
<nav class="site-nav" aria-label="Hauptnavigation">
  <a class="brand-link instant" href="{{ get_url(path='/') }}" aria-label="{{ config.title }} · Startseite">
    <svg class="brand-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 112" role="img" aria-labelledby="title"><title id="title">Melfware</title><path class="ink" d="M4 8h66v18H22v48H4zM102 104H36V86h48V38h18z"/><path fill="#f26a39" d="M22 80h20v20H22z"/><text class="ink" x="124" y="83" font-family="Avenir Next,Inter,Arial,sans-serif" font-size="76" font-weight="600" letter-spacing="-3">Melfware</text></svg>
    <span>{{ config.title }}</span>
  </a>
  <div class="nav-links">
    {% for item in config.extra.sections %}
      {% if item.is_external %}
      <a href="{{ item.path }}" target="_blank" rel="noreferrer noopener">{{ item.name }}</a>
      {% else %}
      {% set item_path = item.path ~ "/" %}
      <a class="instant {% if current_path == item.path or current_path is starting_with(item_path) %}active{% endif %}" href="{{ get_url(path=item.path) }}" {% if current_path == item.path or current_path is starting_with(item_path) %}aria-current="page"{% endif %}>{{ item.name }}</a>
      {% endif %}
    {% endfor %}
  </div>
</nav>
{% endmacro site_nav %}
