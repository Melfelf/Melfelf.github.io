<body class="not-found">
  
  <script>
    const theme = sessionStorage.getItem('theme');
    const match = window.matchMedia("(prefers-color-scheme: dark)").matches
    if ((theme && theme == 'dark') || (!theme && match)) {
      document.body.classList.add('dark');
      const hl = document.querySelector('link#hl');
      if (hl) hl.href = 'https://melf.ch/hl-dark.css';
    }
  </script>
  
  
<div class="wrapper lost">
  <p class="lost-code">404</p>
  <h1 class="error">Seite nicht gefunden</h1>
  <p>Die Adresse existiert nicht oder wurde verschoben.</p>
  <a class="btn btn-primary instant" href="https://melf.ch">Zurück zur Startseite</a>
</div>
